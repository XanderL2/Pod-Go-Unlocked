<main class="main">
  <section class="main__content">
    <div class="main__content--titles">
      <h1>{{ title() }}</h1>
      <p>{{ subTitle() }}</p>
    </div>
    <div class="main__content--dropZone">
      <app-file-input
        accept=".pgp"
        label="Drop your PodGo Preset here!"
        [iconUrl]="`${feedbackIconsPath}/guitar-amp.svg`"
        [dragIcon]="`${feedbackIconsPath}/upload.svg`"
        (filesDropped)="handlePresetUpload($event)"
      />
    </div>
  </section>
</main>
