@let name = activePreset()?.name;
@let version = activePreset()?.version;
@let tempo = activePreset()?.tempo;

<main class="preset">
  <section class="preset__details">
    <h1>Unlock your preset</h1>
    <h3>{{ name }} - Version: {{ version }}</h3>
    <p>Tempo: {{ tempo }}</p>
  </section>

  <section class="preset__buttons">
    <app-button color="error"> Cancel </app-button>
    <app-button color="tertiary"> Export </app-button>
  </section>

  <section class="preset__pedalBoardSetup">
    <app-pedal-board-setup
      [blocks]="activePreset()?.pedalSetup!"
      (blockTapped)="openEditorToolbar($event)"
      (contextMenuBlock)="toggleEnabledBlock($event)"
    />
  </section>


  <app-bottom-sheet [(isOpen)]="isToolBarOpen" label="Block options">
    @let block = tappedBlock();

    @if (block) {
      <app-edit-preset-panel 
        [block]="block"
        
      />
    }
  </app-bottom-sheet>
</main>
