<div class="card">
  <div class="card__imageContainer">
    <img class="card__image" [src]="imagePath()" [alt]="title()" />
  </div>
  <div class="card__content">
    <div class="card__contentTitles">
      <div class="card__title">
        <h3>{{ title() }}</h3>
      </div>
      <div class="card__description">
        <p>{{ description() }}</p>
      </div>
    </div>

    <div class="card__extraContent">
      <ng-content></ng-content>
    </div>
  </div>
</div>
